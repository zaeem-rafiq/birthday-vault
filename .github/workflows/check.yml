# Runs ./check on GitHub for every push to main and every pull request.
# The job id "check" is the status that branch protection on main requires.
# Versions checked on 9 Nov 2026: actions/checkout v7.0.1, actions/cache v6.1.0,
# cargo-near 0.23.0. Rust comes from rust-toolchain.toml. near-workspaces downloads the
# sandbox it needs, because scripts/env.sh sets NEAR_SANDBOX_BIN_PATH only on the Mac.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (secret scanner)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-near 0.23.0
        run: |
          curl -sSfL -o /tmp/cargo-near.tar.gz https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "94008b827a457750257eced4b571c33736062cc3bd1ffda3e7af70e2bc9a4073  /tmp/cargo-near.tar.gz" | sha256sum -c -
          mkdir -p /tmp/cargo-near && tar -xzf /tmp/cargo-near.tar.gz -C /tmp/cargo-near
          find /tmp/cargo-near -type f -name cargo-near -exec install {} "$HOME/.cargo/bin/" \;
          cargo near --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: ./check

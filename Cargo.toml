[workspace]
members = [
    "contracts/collection",
    "tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = { version = "=5.30.1", features = ["global-contracts"] }
near-contract-standards = "=5.30.1"
borsh = "1.8.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
